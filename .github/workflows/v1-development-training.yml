name: v1-development-training

on:
  push:
    branches: [main]
    paths:
      - "src/deepmm/training/v1_public_config.py"
      - "src/deepmm/training/torch_fit.py"
      - "src/deepmm/fusion/neural_torch.py"
      - "src/deepmm/vision/**"
      - "src/deepmm/datasets/nupt_public_v1.py"
      - "scripts/run_v1_development_training.py"
      - "tests/test_v1_training_lock.py"
      - "docs/v1_neural_training_lock.md"
      - ".github/workflows/v1-development-training.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  locked-fit-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout DeepMM-Biometrics
        uses: actions/checkout@v4
        with:
          path: deepmm

      - name: Checkout official NUPT-FPV public subset
        uses: actions/checkout@v4
        with:
          repository: REN382333467/NUPT-FPV
          ref: main
          path: external/NUPT-FPV
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deepmm/pyproject.toml

      - name: Install pinned CPU stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2 torchvision==0.17.2
          python -m pip install "Pillow>=10,<13" "scikit-learn>=1.4,<1.9" "pytest>=8,<10" "pytest-cov>=5,<8"

      - name: Install DeepMM without dependency re-resolution
        working-directory: deepmm
        run: python -m pip install -e . --no-deps

      - name: Record environment
        working-directory: deepmm
        run: |
          python --version
          python - <<'PY'
          import numpy, PIL, sklearn, torch, torchvision
          print('numpy', numpy.__version__)
          print('Pillow', PIL.__version__)
          print('scikit-learn', sklearn.__version__)
          print('torch', torch.__version__)
          print('torchvision', torchvision.__version__)
          PY

      - name: Validate locked training and model contracts
        working-directory: deepmm
        run: |
          pytest \
            tests/test_v1_training_lock.py \
            tests/test_torch_fit.py \
            tests/test_neural_torch.py \
            tests/test_v1_vision_protocol.py

      - name: Execute V1 development-only fit and selection
        working-directory: deepmm
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          mkdir -p artifacts
          python scripts/run_v1_development_training.py \
            ../external/NUPT-FPV \
            --output artifacts/v1_development_training.json

      - name: Upload locked development result
        uses: actions/upload-artifact@v4
        with:
          name: v1-development-training
          path: deepmm/artifacts/v1_development_training.json
          if-no-files-found: error
          retention-days: 30
