name: v1-final-evaluation

on:
  push:
    branches: [main]
    paths:
      - ".github/v1-final-authorized"
  workflow_dispatch:

jobs:
  locked-q1-q3-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout DeepMM-Biometrics
        uses: actions/checkout@v4
        with:
          path: deepmm

      - name: Checkout official NUPT-FPV public subset
        uses: actions/checkout@v4
        with:
          repository: REN382333467/NUPT-FPV
          ref: main
          path: external/NUPT-FPV
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deepmm/pyproject.toml

      - name: Install pinned CPU stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2 torchvision==0.17.2
          python -m pip install "Pillow>=10,<13" "scikit-learn>=1.4,<1.9" "pytest>=8,<10"
          python -m pip install -e deepmm --no-deps

      - name: Validate every pre-final lock
        working-directory: deepmm
        run: |
          pytest \
            tests/test_v1_training_lock.py \
            tests/test_v1_selection_lock.py \
            tests/test_v1_final_policy_lock.py \
            tests/test_v1_stress_plan.py \
            tests/test_v1_calibration_lock.py \
            tests/test_v1_final_execution_lock.py
          python scripts/run_v1_final_evaluation.py \
            ../external/NUPT-FPV \
            --preflight-only

      - name: Execute the locked 4,000-trial Q1-Q3 campaign
        working-directory: deepmm
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          python scripts/run_v1_final_evaluation.py \
            ../external/NUPT-FPV \
            --code-commit "${GITHUB_SHA}" \
            --output-dir artifacts/v1-final

      - name: Upload immutable raw and summarized evidence
        uses: actions/upload-artifact@v4
        with:
          name: v1-final-q1-q3
          path: deepmm/artifacts/v1-final/
          if-no-files-found: error
          retention-days: 90
