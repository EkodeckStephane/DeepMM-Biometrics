name: v1-encoder-screen

on:
  push:
    branches: [main]
    paths:
      - "src/deepmm/vision/**"
      - "scripts/run_v1_encoder_screen.py"
      - ".github/workflows/v1-encoder-screen.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  frozen-encoder-development-screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DeepMM-Biometrics
        uses: actions/checkout@v4
        with:
          path: deepmm

      - name: Checkout official NUPT-FPV public subset
        uses: actions/checkout@v4
        with:
          repository: REN382333467/NUPT-FPV
          ref: main
          path: external/NUPT-FPV
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deepmm/pyproject.toml

      - name: Install pinned CPU vision stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2 torchvision==0.17.2
          python -m pip install "Pillow>=10,<13"

      - name: Install DeepMM without dependency re-resolution
        working-directory: deepmm
        run: |
          python -m pip install "scikit-learn>=1.4,<1.9" "pytest>=8,<10" "pytest-cov>=5,<8"
          python -m pip install -e . --no-deps

      - name: Record environment
        working-directory: deepmm
        run: |
          python --version
          python - <<'PY'
          import numpy, PIL, sklearn, torch, torchvision
          print('numpy', numpy.__version__)
          print('Pillow', PIL.__version__)
          print('scikit-learn', sklearn.__version__)
          print('torch', torch.__version__)
          print('torchvision', torchvision.__version__)
          PY

      - name: Run development-only frozen encoder screen
        working-directory: deepmm
        run: |
          mkdir -p artifacts
          python scripts/run_v1_encoder_screen.py ../external/NUPT-FPV --output artifacts/v1_encoder_screen.json

      - name: Upload development screen result
        uses: actions/upload-artifact@v4
        with:
          name: v1-encoder-screen
          path: deepmm/artifacts/v1_encoder_screen.json
          if-no-files-found: error
