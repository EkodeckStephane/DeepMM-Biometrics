[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepmm-biometrics"
version = "0.1.0"
description = "Controlled benchmark infrastructure for Deep Learning Approaches for Multimodal Biometrics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
neural = [
  "torch>=2.2,<3",
]
vision = [
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "Pillow>=10,<13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
